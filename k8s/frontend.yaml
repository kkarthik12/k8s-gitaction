apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: student-gitaction
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: frontend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: karthikk8s.azurecr.io/student-frontend-gitaction:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80