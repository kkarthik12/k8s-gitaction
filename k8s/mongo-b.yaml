apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-b
  namespace: student-gitaction
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo-b
  template:
    metadata:
      labels:
        app: mongo-b
    spec:
      nodeSelector:
        mongo: b
      initContainers:
        - name: keyfile
          image: busybox:1.36
          command: ["sh", "-c", "cp /secret/keyfile /keyfile/keyfile && chmod 400 /keyfile/keyfile && chown 999:999 /keyfile/keyfile"]
          volumeMounts:
            - name: secret
              mountPath: /secret
            - name: keyfile
              mountPath: /keyfile
      containers:
        - name: mongo
          image: mongo:7.0
          args: ["--replSet", "rs0", "--keyFile", "/keyfile/keyfile", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /keyfile
      volumes:
        - name: secret
          secret:
            secretName: mongo-keyfile
        - name: keyfile
          emptyDir: {}
        - name: data
          hostPath:
            path: /mnt/data/mongo-rs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-b
  namespace: student-gitaction
spec:
  selector:
    app: mongo-b
  ports:
    - port: 27017