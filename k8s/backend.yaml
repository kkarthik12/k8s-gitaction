apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      imagePullSecrets: [{ name: acr-secret }]
      containers:
        - name: backend
          image: __REGISTRY__/student-backend:__TAG__
          ports: [{ containerPort: 5000 }]
          env:
            - name: MONGO_URI          # match the variable name in your compose file
              value: mongodb://mongo:27017/studentdb
---
apiVersion: v1
kind: Service
metadata: { name: backend }
spec:
  selector: { app: backend }
  ports: [{ port: 5000 }]