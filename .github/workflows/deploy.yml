name: deploy-student-app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/student-backend-gitaction:1.0

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/student-frontend-gitaction:1.0

  deploy:
    needs: build
    runs-on: [self-hosted, k8s-master]
    env:
      NS: student-gitaction
    steps:
      - uses: actions/checkout@v4

      - name: Set image registry and tag in manifests
        run: |
          sed -i "s|__REGISTRY__|${{ secrets.ACR_LOGIN_SERVER }}|g; s|__TAG__|${{ github.sha }}|g" k8s/*.yaml

      - name: Apply manifests in order
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -n $NS -f k8s/tls.yaml
          kubectl apply -n $NS -f k8s/mongo.yaml
          kubectl apply -n $NS -f k8s/mongo-b.yaml
          kubectl apply -n $NS -f k8s/backend.yaml
          kubectl apply -n $NS -f k8s/frontend.yaml
          kubectl apply -n $NS -f k8s/frontend-svc.yaml

      - name: Wait for pods
        run: |
          kubectl wait --for=condition=Ready pod --all -n $NS --timeout=180s

      - name: Show status
        if: always()
        run: kubectl get pods,svc -n $NS -o wide